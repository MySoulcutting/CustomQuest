# ================================================================
# 示例任务：提交物品（多种物品，支持自定义显示名与自定义名字物品）
# ================================================================

quest-id: example_submit
name: "&e收集钻石"

# ----------------------------------------------------------------
# 全息视图（计分板）显示自定义（可选，二选一）：
#
# 方式一（完全自定义，推荐）：写 board-title + board-line 列表，
#   直接指定计分板上显示的每一行（可写任意多行，不会自动生成目标行）。
#   board-title 变量：{name} {id} {type}
#   board-line 每行变量：
#     {name} {id} {type} {current} {total}              —— 任务信息与总进度
#     {target1} {display1} {mob1} {item1}               —— 第 1 个目标的标识/显示名
#     {current1} {total1} {amount1}                     —— 第 1 个目标的进度/需求
#     …… 依此类推，数字为目标序号（从 1 开始）
# ----------------------------------------------------------------
# board-title: "&b&l{name}"
# board-line:
#   - "&7目标1：收集 &f{display1} &e{current1}&7/&e{total1}"
#   - "&7目标2：收集 &f{display2} &e{current2}&7/&e{total2}"
#   - "&7总进度：&e{current}&7/&e{total}"
description:
  - "&7矿工需要 &e5 &7个大钻石和 &e10 &7个铁锭，"
  - "&7收集完毕后点击对话选项提交！"

type: submit_item

# ----------------------------------------------------------------
# 导航目标（可选）：SoulCore Fabric 客户端在此渲染信标光柱、悬浮标签与距离
# navigate: "world,100,64,200"      # 世界名,x,y,z
# ----------------------------------------------------------------

# ----------------------------------------------------------------
# 写法一：items 简写列表（材料:数量，不限制物品名字）
# ----------------------------------------------------------------
# items:
#   - "DIAMOND:5"
#   - "IRON_INGOT:10"

# ----------------------------------------------------------------
# 写法二：objectives 列表（推荐，支持更多自定义）：
#   name      自定义显示名（计分板/提示里显示的文字，支持 & 颜色）
#   item-name 可选：只收集「显示名等于该文字」的物品
#             （物品需要用铁砧改名或插件赋予对应名字，支持 & 颜色代码）
# ----------------------------------------------------------------
objectives:
  - item: "DIAMOND:5"
    name: "&b大钻石"                    # 显示为「已收集 大钻石 x/5」
    item-name: "&b大钻石"               # 只收集显示名为「大钻石」的钻石（可选）
    # 可选：该目标在计分板上的显示行格式（留空/不写 = 用 config.yml 的 item-line）
    # 可用变量：{mob} {item} {target} {display} {current} {total} {amount} {index} {name} {id} {type}
    # board-line: "&b收集 {target} &e{current}&7/&e{total}"
  - item: "IRON_INGOT:10"
    name: "&f铁锭"

# 提交物品任务一般手动提交（在对话选项里用 Kether 动作 quest submit example_submit）
auto-complete: false

repeatable: false
cooldown: 0

commands:
  - "give %player% EMERALD 2"

kether:
  - "message '&a感谢你的收集！'"
