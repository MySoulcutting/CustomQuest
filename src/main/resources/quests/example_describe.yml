# ================================================================
# 示例任务：描述任务（display / 展示型任务）
# ================================================================
# 描述任务没有任何目标，用于在「全息视图」（右侧计分板）上展示
# 任务标题与任务内容；它只能通过指令强制完成：
#   /cq quest complete <玩家> describe_story
# （接取后即显示在计分板；完成即从计分板移除）
# ================================================================

quest-id: describe_story

# 任务标题（计分板首行）
name: "&6&l主线剧情"

# 可选：该任务在「全息视图（计分板）」上的显示（二选一）：
# 方式一（完全自定义）：board-title + board-line 列表
#   board-title 变量：{name} {id} {type}
#   board-line 每行变量：{name} {id} {type}（描述任务无目标，无 {current}/{total}）
# board-title: "&d&l{name}"
# board-line:
#   - "&7主线剧情进行中…"
#   - "&7找老杰克聊聊吧"
# 方式二（默认）：不写 board-line 时，自动展示下方 description 内容

# 任务内容（计分板上逐行展示，支持 & 颜色与 PAPI）
description:
  - "&a第一章 &f· &e初入荒野"
  - "§b找老杰克§d聊聊吧"

# 任务类型：describe（描述任务，无目标，仅指令完成）
type: describe

# 导航目标（可选）：SoulCore NeoForge 客户端在此渲染信标光柱、悬浮标签与距离
# navigate: "world,100,64,200"      # 世界名,x,y,z

repeatable: false
cooldown: 0
