# =====================================================
# CustomQuest 全局配置
# =====================================================

# 玩家数据自动保存间隔（秒）
autosave-seconds: 300

# -----------------------------------------------------
# 任务追踪（SoulCore HUD / 原生计分板回退）
# HUD 快照固定每 5 秒重发一次，供客户端检测失效后端并清理残留（当前不可配置）
# -----------------------------------------------------
scoreboard:
  # 任务追踪总开关：SoulCore 客户端显示 HUD，其余客户端回退到计分板
  # false 会同时清空 HUD 与本插件设置的计分板
  enabled: true
  # 回退计分板标题（支持 & 颜色代码）
  title: "&6&l任务追踪"
  # 回退计分板中每个任务之间的空行数（0 = 无空格）
  gap-lines: 1

# -----------------------------------------------------
# 任务书（/quest 指令打开）
# -----------------------------------------------------
quest-book:
  # 任务书中每个任务之间的空行数（0 = 无空格）
  gap-lines: 1
  # 任务书每页显示的任务数
  per-page: 3
  # 没有接取任务时，任务书第一行显示的文本
  # （支持 & 颜色代码；内容顶格显示，如需偏移可自行在开头加空格）
  no-quest: "&c您当前没有接取任务..."
