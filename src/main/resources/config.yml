# =====================================================
# CustomQuest 全局配置
# =====================================================

# 玩家数据自动保存间隔（秒）
autosave-seconds: 300

# -----------------------------------------------------
# 任务追踪（右侧计分板）
# 每 5 秒兜底刷新一次；背包与进度变化由事件即时刷新
# -----------------------------------------------------
scoreboard:
  # 任务追踪总开关
  # false 会清空本插件为玩家设置的任务计分板
  enabled: true
  # 计分板标题（支持 & 颜色代码）
  title: "&6&l任务追踪"
  # 每个任务之间的空行数（0 = 无空格）
  gap-lines: 1

# -----------------------------------------------------
# NPC 对话
# 对话界面由服务器打开的原版箱子承载，不依赖任何客户端模组：
# 第 1 格是书本（NPC 标题与正文），第 3 格起依次是选项，点击选项格即提交。
# -----------------------------------------------------
dialogue:
  # 箱子标题（也是按容器名匹配的插件所用名称）。
  # ChaUI 的容器名匹配不支持中文，需要覆盖显示时请改成 ASCII 名称，例如 "NPC Dialogue"。
  title: "NPCdialogue"

# -----------------------------------------------------
# 玩家数据存储
#
# 任务进度、完成记录、NPC 数据都存在数据库里。
#
# type 二选一：
#   sqlite —— 本机单文件库（默认，备份=拷一个文件）
#   mysql  —— 外部库，可让多个子服共享同一份玩家数据
#
# 改完需要重启服务器。
# -----------------------------------------------------
storage:
  type: sqlite

  sqlite:
    # 只写文件名，不要带目录（相对插件数据目录）。
    # 改这里等于换一个库文件：旧库不会被自动迁移，需要自行拷贝或重命名。
    file: data.db

  mysql:
    host: 127.0.0.1
    port: 3306
    database: customquest
    username: root
    password: ""
    # 多套环境共用一个库时用来隔离；只允许字母、数字、下划线。
    table-prefix: ""

  # 首次启用数据库时，把旧版 data/<uuid>.yml 的玩家数据一次性导入。
  # 导入后原 yml 保留作备份；重复启动不会重复导入（库内有迁移标记）。
  migrate-from-yaml: true
