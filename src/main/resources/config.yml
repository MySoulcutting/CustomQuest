# =====================================================
# CustomQuest 全局配置
# =====================================================

# 玩家数据自动保存间隔（秒）
autosave-seconds: 300

# -----------------------------------------------------
# 全息视图（任务计分板）
# -----------------------------------------------------
scoreboard:
  # 是否打开全息任务追踪（true 开启 / false 关闭）
  enabled: true
  # 计分板标题（支持 & 颜色代码）
  title: "&6&l任务追踪"
  # 全息显示中每个任务之间的空行数（0 = 无空格）
  gap-lines: 1

# -----------------------------------------------------
# 任务书（/quest 指令打开）
# -----------------------------------------------------
quest-book:
  # 任务书中每个任务之间的空行数（0 = 无空格）
  gap-lines: 1
  # 任务书每页显示的任务数
  per-page: 3
  # 没有接取任务时，任务书第一行显示的文本
  # （支持 & 颜色代码；内容顶格显示，如需偏移可自行在开头加空格）
  no-quest: "&c您当前没有接取任务..."
