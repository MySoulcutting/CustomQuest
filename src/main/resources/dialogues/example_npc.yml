# ================================================================
# 示例 NPC 对话配置
# 文件位置：plugins/CustomQuest/dialogues/
# 一个文件绑定一个或多个 Citizens NPC（通过 npc 字段）
# ================================================================

# 绑定的 Citizens NPC id（可用单个数字或列表 [5, 6]）
npc: 5

# 对话标题（打开对话时显示在顶部）
title: "&8[&6任务发布官&8] &f老杰克"

# ----------------------------------------------------------------
# 首次对话初始化（可选，推荐）：玩家第一次点击该 NPC 时，
# 若某个 data 变量不存在，则自动写入默认值（玩家级，互不影响）。
# 这样分支条件（如 data: stage / data-value: none）在第一次对话时就能生效。
# ----------------------------------------------------------------
default-data:
  stage: none

# ----------------------------------------------------------------
# 分支对话：玩家点击 NPC 后，从上到下查找第一个「条件全部满足」的分支显示。
# 通过 NPC 的 data 变量（data / data-value）或 PAPI 变量（papi）触发不同分支，
# data 值不同 -> 显示不同对话 -> 用于接取任务 / 推进剧情。
#
# 重要：NPC data 变量为「玩家级」数据 —— 每个玩家在该 NPC 上有自己独立的 data 值，
# 因此不同玩家会处于不同的对话分支，互不影响（持久化保存）。
#
# 可用指令管理（需指定玩家）：
#   /cq data set <玩家> 5 stage none
#   /cq data get <玩家> 5 stage
# 也可以在对话选项的 Kether 动作里修改（自动作用于当前玩家）：
#   npc data set stage doing
# ----------------------------------------------------------------
branches:

  # ============ 分支一：初始状态（stage == none 时显示） ============
  initial:
    # NPC data 条件（写法一：key + data-value）
    data: stage
    data-value: none
    # 也可以写成列表形式（写法二）：
    # data:
    #   - "stage==none"
    #   - "level>=1"

    # PAPI 条件（可选）
    papi:
      - "%player_level% >= 3"

    # 对话内容
    lines:
      - "&f你好，旅行者！我这里有件麻烦事……"
      - "&f骷髅王最近在荒野上横行，你能帮我去讨伐它吗？"

    # 对话选项
    options:
      accept:
        text: "&a&l[接受任务] &a清剿荒野"
        hover: "&7点击接受任务"
        # ---- 接取任务快捷指令（推荐写法）----
        # 点击后直接接取任务（不校验前置条件），
        # 接取成功后自动设置「该玩家」在此 NPC 上的 data 变量，推进分支对话
        accept-quest: example_kill
        accept-data: "stage=doing"
        # 也可继续追加 Kether 动作（接取任务之后执行）：
        # kether:
        #   - "message '&a祝你顺利！'"
      reject:
        text: "&7&l[拒绝] &7我暂时没空"
        hover: "&7点击拒绝"
        kether:
          - "npc data set stage none"

  # ============ 分支二：任务进行中（stage == doing 时显示） ============
  doing:
    data: stage
    data-value: doing
    lines:
      - "&f怎么样？怪物清剿了吗？&7（进度 &e%customquest_progress_example_kill%&7）"
    options:
      check:
        text: "&e&l[检查进度] &e我的进度如何？"
        hover: "&7查看进度"
        kether:
          - "tell &7当前进度：quest progress example_kill"
      submit:
        text: "&a&l[提交任务] &a我已经完成了！"
        hover: "&7提交任务"
        # ---- Kether 写法：quest submit 提交并推进分支 ----
        kether:
          - "quest submit example_kill"
          - "npc data set stage done"

  # ============ 分支三：任务完成（stage == done 时显示） ============
  done:
    data: stage
    data-value: done
    lines:
      - "&f感谢你的帮助，这是你的报酬！"
    options:
      ok:
        text: "&7&l[离开] &7再见"
        kether:
          - "npc data set stage none"

  # ============ 兜底分支：以上分支都不满足时显示（可选） ============
  fallback:
    default: true
    lines:
      - "&f……"
    options:
      leave:
        text: "&7离开"
        kether: []
