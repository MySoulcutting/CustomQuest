name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify tag version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' build.gradle.kts)"
          test -n "$VERSION"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Generate release notes
        run: .github/scripts/generate-release-notes.sh "$GITHUB_REF_NAME" release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/CustomQuest-$VERSION.jar" \
            --verify-tag \
            --notes-file release-notes.md \
            --fail-on-no-commits \
            --title "CustomQuest $VERSION"
