<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CustomQuest 配置编辑器</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141f31;--panel-strong:#1a2940;--surface:#0f1928;--line:#2b3c55;--text:#e7edf7;--muted:#93a4ba;--accent:#67b7ff;--accent-strong:#3399f3;--danger:#fb7185;--ok:#42d39b;--shadow:0 18px 50px #02061755}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,#162b48 0,#0b1220 42%,#080d17 100%);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}header{position:sticky;top:0;z-index:5;border-bottom:1px solid #26364c;background:#0b1220e8;backdrop-filter:blur(14px)}.header-inner{max-width:1580px;margin:auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1,h2,h3{margin:0}h1{font-size:21px;letter-spacing:.2px}h2{font-size:17px}h3{font-size:14px}.subtitle,.hint,.section-note{color:var(--muted)}.subtitle{font-size:13px;margin-top:2px}.local-badge,.type-badge{display:inline-flex;align-items:center;border:1px solid #38506f;border-radius:999px;background:#14243a;color:#bfe1ff;padding:4px 10px;font-size:12px;font-weight:700;white-space:nowrap}main{max-width:1580px;margin:0 auto;padding:18px 28px 32px}.tabs{display:flex;gap:6px;margin-bottom:14px;padding:4px;width:max-content;border:1px solid var(--line);border-radius:11px;background:#0d1726}.tab,button{border:1px solid var(--line);border-radius:8px;background:#1b2a40;color:var(--text);padding:8px 12px;cursor:pointer;font:inherit;font-weight:650}.tab{border-color:transparent;background:transparent}.tab.active,button.primary{background:var(--accent);border-color:var(--accent);color:#07111f}.tab:hover,button:hover{filter:brightness(1.12)}button.danger{color:#fecdd3;border-color:#713947;background:#35202a}button.small{padding:5px 9px;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(560px,1.08fr) minmax(400px,.92fr);gap:16px;align-items:start}.panel{min-width:0;border:1px solid var(--line);border-radius:14px;background:#101a2aee;box-shadow:var(--shadow)}.editor-panel{padding:16px}.editor-head,.section-head,.preview-head,.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.editor-head{padding:2px 2px 14px}.save-path{margin-top:4px;color:var(--muted);font-size:12px}.save-path code{color:#bfe1ff}.form-section{margin-top:12px;padding:15px;border:1px solid #263a55;border-radius:12px;background:#152238}.section-head{margin-bottom:12px}.section-head h3{font-size:15px}.section-note{font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}.field{display:flex;flex-direction:column;gap:5px;margin:0}.field.full{grid-column:1/-1}label{font-weight:700;color:#d9e9fb;font-size:13px}input,select,textarea{width:100%;border:1px solid #344861;border-radius:8px;background:#0c1524;color:var(--text);padding:8px 10px;font:inherit}textarea{min-height:70px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #67b7ff44;border-color:var(--accent)}.type-help{grid-column:1/-1;margin-top:-2px;padding:9px 11px;border:1px solid #294867;border-radius:8px;background:#10243a;color:#b9c9dc;font-size:12px}.card{margin:9px 0;padding:12px;border:1px solid #30445f;border-radius:10px;background:#192941}.card:first-child{margin-top:0}.card:last-child{margin-bottom:0}.card-head{margin-bottom:10px}.card-head h3{color:#ddecff}.empty-state{padding:14px;border:1px dashed #38506f;border-radius:9px;color:var(--muted);text-align:center}.array-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:7px 0}.array-row input{min-width:0}.check{display:flex;flex-direction:row;align-items:center;gap:8px;min-height:36px}.check input{width:auto}.advanced{margin-top:12px;border:1px solid #263a55;border-radius:12px;background:#111d2f;overflow:hidden}.advanced summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;cursor:pointer;font-weight:750;list-style:none}.advanced summary::-webkit-details-marker{display:none}.advanced summary::after{content:'展开';color:var(--accent);font-size:12px}.advanced[open] summary::after{content:'收起'}.advanced[open] summary{border-bottom:1px solid #263a55}.advanced-body{padding:15px}.preview{position:sticky;top:78px;height:calc(100vh - 96px);padding:14px;display:flex;flex-direction:column}.preview-head{margin-bottom:11px}.preview-title .hint{font-size:12px;margin-top:2px}.toolbar{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}.preview pre{flex:1;overflow:auto;margin:0;background:#080f1b;border:1px solid #22344d;border-radius:10px;padding:15px;color:#ccf5df;white-space:pre-wrap;word-break:break-word;font:12.5px/1.62 "Cascadia Code",Consolas,monospace}.status{min-height:20px;color:var(--ok);margin-top:7px;font-size:12px}.section-title{margin-top:20px;border-bottom:1px solid var(--line);padding-bottom:7px}@media(max-width:1120px){.workspace{grid-template-columns:1fr}.preview{position:static;height:560px}}@media(max-width:680px){.header-inner{padding:14px 16px}.local-badge{display:none}main{padding:14px}.editor-panel{padding:11px}.form-grid{grid-template-columns:1fr}.field.full,.type-help{grid-column:auto}.editor-head,.preview-head{align-items:flex-start;flex-direction:column}.toolbar{justify-content:flex-start}.form-section{padding:12px}}
</style>
</head>
<body>
<header><div class="header-inner"><div><h1>CustomQuest 配置编辑器</h1><div class="subtitle">离线编辑任务与 NPC 对话，实时生成可直接使用的 YAML。</div></div><span class="local-badge">本地运行 · 不上传配置</span></div></header>
<main><div class="tabs"><button class="tab active" data-tab="quest">任务</button><button class="tab" data-tab="dialogue">NPC 对话</button></div><div class="workspace"><section class="panel editor-panel"><div id="editor"></div></section><section class="panel preview"><div class="preview-head"><div class="preview-title"><h2>YAML 预览</h2><div class="hint">内容随表单即时更新</div></div><div class="toolbar"><button class="primary" id="copy">复制</button><button id="download">下载</button><button id="import">导入</button><input id="file" type="file" accept=".yml,.yaml,text/yaml" hidden><button id="reset">重置</button></div></div><pre id="preview"></pre><div class="status" id="status"></div></section></div></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), lines=v=>(Array.isArray(v)?v:String(v??'').split(/\r?\n/)).map(x=>String(x??'').trim()).filter(Boolean), blank=v=>String(v??'').trim(), boolValue=v=>v===true||(typeof v==='string'&&v.trim().toLowerCase()==='true');
const initial={quest:{file:'my_quest',id:'my_quest',name:'&e新任务',type:'kill_mob',description:['&7任务描述'],objectives:[{target:'Zombie',amount:5,display:'&a僵尸',itemName:'',boardLine:'',kind:'normal'}],conditionCommands:[],repeatable:false,cooldown:0,boardTitle:'',boardLines:[],navigate:'',navigateOnAccept:false},dialogue:{file:'my_npc',npcIds:'5',title:'&8[&6任务发布官&8] &fNPC',branches:[{id:'suxing1',data:['5== null'],papi:[],lines:['&f你好，旅行者！'],options:[{text:'&a你有什么任务',mode:'none',quest:'',submitItems:[],kether:['npc data set 5 1'],goto:'suxing2',close:false}]}]}};
const draftCacheKey='customquest.editor.draft.v1';
let restoredDraft=false;
function clone(value){return typeof structuredClone==='function'?structuredClone(value):JSON.parse(JSON.stringify(value))}
function stringArray(value,fallback=[]){return Array.isArray(value)?value.filter(item=>item!=null).map(String):clone(fallback)}
function normalizeObjective(value,fallback){const source=value&&typeof value==='object'?value:{};return{target:String(source.target??fallback.target??''),amount:Number(source.amount)>0?Number(source.amount):fallback.amount,display:String(source.display??''),itemName:String(source.itemName??''),boardLine:String(source.boardLine??''),kind:source.kind==='ni'?'ni':'normal'}}
function normalizeSubmitItem(value){if(typeof value==='string'){const text=value.trim();if(!text)return '';if(text.startsWith('{')&&text.endsWith('}')){try{const parsed=JSON.parse(text);return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:text}catch(error){}}return text}if(!value||typeof value!=='object'||Array.isArray(value))return '';return clone(value)}
function normalizeSubmitItems(value){return(Array.isArray(value)?value:value==null?[]:[value]).map(normalizeSubmitItem).filter(Boolean)}
function submitItemText(value){if(typeof value==='string')return value;if(!value||typeof value!=='object')return '';const keys=Object.keys(value);if(keys.every(key=>['item','neige-item','ni','amount'].includes(key))){const target=value['neige-item']??value.ni??value.item??'';return `${value['neige-item']!=null||value.ni!=null?'neige-item':'item'}:${target}:${Number(value.amount)||1}`}return JSON.stringify(value)}
function parseSubmitItem(value){const text=String(value??'').trim();if(!text)return '';if(text.startsWith('{')&&text.endsWith('}')){try{const parsed=JSON.parse(text);return parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?parsed:text}catch(error){}}return text}
function normalizeOption(value){const source=value&&typeof value==='object'?value:{};const quest=String(source.quest??'');const kether=stringArray(source.kether);return{text:String(source.text??''),mode:source.mode==='submit'?'submit':'none',quest,submitItems:normalizeSubmitItems(source.submitItems),kether,goto:String(source.goto??''),close:Boolean(source.close)}}
function normalizeBranch(value,index){if(!value||typeof value!=='object')return null;return{id:String(value.id??`node_${index+1}`),data:stringArray(value.data),papi:stringArray(value.papi),lines:stringArray(value.lines,['']),options:Array.isArray(value.options)?value.options.map(normalizeOption):[]}}
function normalizeQuestDraft(value){const source=value&&typeof value==='object'?value:{};const next=clone(initial.quest);next.file=String(source.file??next.file);next.id=String(source.id??next.id);next.name=String(source.name??next.name);next.type=['kill_mob','submit_item','craft_item','craft_count','describe'].includes(source.type)?source.type:next.type;next.description=stringArray(source.description,next.description);next.objectives=Array.isArray(source.objectives)?source.objectives.map(item=>normalizeObjective(item,next.objectives[0])):clone(next.objectives);next.conditionCommands=stringArray(source.conditionCommands);next.repeatable=Boolean(source.repeatable);next.cooldown=Number(source.cooldown)>=0?Number(source.cooldown):0;next.boardTitle=String(source.boardTitle??'');next.boardLines=stringArray(source.boardLines);next.navigate=String(source.navigate??'');next.navigateOnAccept=boolValue(source.navigateOnAccept);return next}
function normalizeDialogueDraft(value){const source=value&&typeof value==='object'?value:{};const next=clone(initial.dialogue);next.file=String(source.file??next.file);next.npcIds=String(source.npcIds??next.npcIds);next.title=String(source.title??next.title);next.branches=Array.isArray(source.branches)?source.branches.map(normalizeBranch).filter(Boolean):clone(next.branches);return next}
function loadDraft(){try{const raw=localStorage.getItem(draftCacheKey);if(!raw)return clone(initial);const saved=JSON.parse(raw);if(!saved||typeof saved!=='object')return clone(initial);const next={quest:normalizeQuestDraft(saved.quest),dialogue:normalizeDialogueDraft(saved.dialogue)};restoredDraft=true;return next}catch(error){return clone(initial)}}
function saveDraft(){try{localStorage.setItem(draftCacheKey,JSON.stringify({quest:state.quest,dialogue:state.dialogue}))}catch(error){}}
function clearDraft(){try{localStorage.removeItem(draftCacheKey)}catch(error){}}
let tab='quest', state=loadDraft();
const field=(label,key,value,cls='')=>`<div class="field ${cls}"><label>${label}</label><input data-key="${key}" value="${esc(value)}"></div>`, area=(label,key,value,cls='')=>`<div class="field ${cls}"><label>${label}</label><textarea data-key="${key}">${esc(value)}</textarea></div>`;
const taskTypeMeta={kill_mob:{label:'击杀怪物',help:'按 MythicMobs 怪物内部名分别累计击杀次数。'},submit_item:{label:'提交物品',help:'检查玩家背包中的 Bukkit 材料或 NeigeItems 物品。'},craft_item:{label:'指定合成',help:'按 EpicCraftingsPlus 配置中的合成名称累计成功合成次数。'},craft_count:{label:'合成次数',help:'不限制合成名称，只统计 EpicCraftingsPlus 成功合成事件次数。'},describe:{label:'描述任务',help:'只展示说明内容，不配置目标，需要通过指令强制完成。'}};
function defaultObjective(type){if(type==='kill_mob')return{target:'Zombie',amount:1,display:'',itemName:'',boardLine:'',kind:'normal'};if(type==='submit_item')return{target:'DIAMOND',amount:1,display:'',itemName:'',boardLine:'',kind:'normal'};if(type==='craft_item')return{target:'EpicSword',amount:1,display:'',itemName:'',boardLine:'',kind:'normal'};if(type==='craft_count')return{target:'*',amount:1,display:'',itemName:'',boardLine:'',kind:'normal'};return{target:'',amount:1,display:'',itemName:'',boardLine:'',kind:'normal'}}
const arr=(title,key,values,placeholder='',extra='')=>`<div class="field full"><label>${title}</label><div>${values.map((v,i)=>`<div class="array-row"><input data-array-key="${key}" data-index="${i}" value="${esc(key.startsWith('submitItems.')?submitItemText(v):v)}" placeholder="${placeholder}"><button class="small danger" data-remove-array="${key}" data-index="${i}">删除</button></div>`).join('')}</div><button class="small" data-add-array="${key}">+ 添加一行</button>${extra}</div>`;
function ketherArr(bi,oi,values,questId){const key=`kether.${bi}.${oi}`,command=`quest accept ${blank(questId)||'<任务ID>'}`;return arr('then 多行指令（每行一条 Kether 动作）',key,values,'例如 command inline "say hello" as console',`<div class="hint">内置接取任务动作：<code>${esc(command)}</code>。<button class="small" data-add-kether-accept="${bi},${oi}">插入接取任务指令</button>。</div>`) }
function objectiveCard(o,i){const type=state.quest.type,ni=type==='submit_item'&&o.kind==='ni',single=state.quest.objectives.length===1;let fields='';if(type==='craft_count'){fields=`${field('需要合成次数','amount',o.amount)}${field('显示名称（可选）','display',o.display)}${field('计分板行（可选）','boardLine',o.boardLine,'full')}`}else{const targetLabel=ni?'NeigeItems ID':type==='kill_mob'?'MythicMobs 内部名':type==='craft_item'?'EpicCraftingsPlus 合成名称':'Bukkit 材料名称';fields=`${type==='submit_item'?`<div class="field"><label>物品来源</label><select data-objective-key="kind" data-index="${i}"><option value="normal" ${!ni?'selected':''}>Bukkit 材料</option><option value="ni" ${ni?'selected':''}>NeigeItems</option></select></div>`:''}${field(targetLabel,'target',o.target)}${field(type==='submit_item'?'需要数量':'次数','amount',o.amount)}${field('显示名称（可选）','display',o.display)}${type==='submit_item'?field('物品显示名限制（可选）','itemName',o.itemName):''}${field('计分板行（可选）','boardLine',o.boardLine,'full')}`}return `<div class="card"><div class="card-head"><h3>${type==='craft_count'?'进度条件':`目标 ${i+1}`}</h3>${type!=='craft_count'&&!single?`<button class="small danger" data-remove-objective="${i}">删除</button>`:''}</div><div class="form-grid">${fields}</div></div>`}
function questForm(){const q=state.quest,meta=taskTypeMeta[q.type]||taskTypeMeta.describe,hasObjectives=q.type!=='describe',canAdd=!['describe','craft_count'].includes(q.type);return `<div class="editor-head"><div><h2>任务编辑器</h2><div class="save-path">保存到 <code>plugins/CustomQuest/quests/${esc(q.file||'任务ID')}.yml</code></div></div><span class="type-badge">${meta.label}</span></div><section class="form-section"><div class="section-head"><div><h3>基础信息</h3><div class="section-note">任务标识、名称与玩家可见描述</div></div></div><div class="form-grid">${field('文件名（不含 .yml）','file',q.file)}${field('任务 ID','id',q.id)}${field('任务名称','name',q.name)}<div class="field"><label>任务类型</label><select data-key="type"><option value="kill_mob" ${q.type==='kill_mob'?'selected':''}>击杀 MythicMobs</option><option value="submit_item" ${q.type==='submit_item'?'selected':''}>提交物品</option><option value="craft_item" ${q.type==='craft_item'?'selected':''}>EpicCraftingsPlus 指定合成</option><option value="craft_count" ${q.type==='craft_count'?'selected':''}>EpicCraftingsPlus 合成次数</option><option value="describe" ${q.type==='describe'?'selected':''}>描述任务</option></select></div><div class="type-help">${meta.help}</div>${area('任务描述（每行一条）','description',q.description.join('\n'),'full')}</div></section><section class="form-section"><div class="section-head"><div><h3>任务目标</h3><div class="section-note">${q.type==='craft_count'?'只需设置总合成次数':hasObjectives?'每个目标独立记录进度':'此类型没有进度目标'}</div></div>${canAdd?'<button class="small" data-add-objective>+ 添加目标</button>':''}</div><div>${hasObjectives?q.objectives.map(objectiveCard).join(''):'<div class="empty-state">描述任务不需要配置目标。</div>'}</div></section><section class="form-section"><div class="section-head"><div><h3>达成行为</h3><div class="section-note">首次满足全部目标时执行；message 开头用于发送聊天提示</div></div></div>${area('命令（每行一条）','conditionCommands',q.conditionCommands.join('\n'),'full')}</section><details class="advanced"><summary><span>高级设置</span><span class="section-note">重复接取、追踪显示与导航</span></summary><div class="advanced-body"><div class="form-grid"><div class="field"><label class="check"><input type="checkbox" data-key="repeatable" ${q.repeatable?'checked':''}>允许重复接取</label></div>${field('重复接取冷却（秒）','cooldown',q.cooldown)}${field('计分板标题（可选）','boardTitle',q.boardTitle)}${area('自定义计分板行（每行一条）','boardLines',q.boardLines.join('\n'))}${field('导航位置（world,x,y,z）','navigate',q.navigate,'full')}<div class="field full"><label class="check"><input type="checkbox" data-key="navigateOnAccept" ${q.navigateOnAccept?'checked':''}>接受任务后自动开启导航</label><div class="hint">需同时配置有效的导航位置。</div></div></div></div></details>`}
function optionCard(o,bi,oi){return `<div class="card"><div class="card-head"><h3>选项 ${oi+1}</h3><button class="small danger" data-remove-option="${bi},${oi}">删除</button></div><div class="form-grid">${field('按钮文字','text',o.text)}<div class="field"><label>快捷动作</label><select data-option-key="mode" data-branch="${bi}" data-option="${oi}"><option value="submit" ${o.mode==='submit'?'selected':''}>提交任务</option><option value="none" ${o.mode==='none'?'selected':''}>无</option></select></div>${field('任务 ID','quest',o.quest)}${field('点击后跳转节点（可选）','goto',o.goto||'')}${o.mode==='submit'?arr('覆盖提交物品（MATERIAL:数量 或 neige-item:ID:数量）',`submitItems.${bi}.${oi}`,o.submitItems):''}${ketherArr(bi,oi,o.kether,o.quest)}<div class="field"><label class="check"><input type="checkbox" data-option-key="close" data-branch="${bi}" data-option="${oi}" ${o.close?'checked':''}>点击后关闭对话</label></div></div></div>`}
function branchCard(b,i){return `<div class="card"><div class="card-head"><h3>对话节点 ${i+1}</h3><button class="small danger" data-remove-branch="${i}">删除</button></div><div class="form-grid">${field('节点 ID','branchId',b.id)}${arr('NPC 变量条件（如 5== null）',`data.${i}`,b.data)}${arr('PAPI 条件（如 %player_level% >= 10）',`papi.${i}`,b.papi)}${arr('NPC 对话内容（每行一条）',`lines.${i}`,b.lines,'对话文本')}${b.options.map((o,j)=>optionCard(o,i,j)).join('')}<button class="small" data-add-option="${i}">+ 添加按钮</button></div></div>`}
function dialogueForm(){const d=state.dialogue;return `<h2>NPC 对话配置</h2><div class="hint">生成后保存为 plugins/CustomQuest/dialogues/${esc(d.file||'对话文件')}.yml；NPC 变量未配置默认值，首次判断为 null。</div><div class="form-grid">${field('文件名（不含 .yml）','file',d.file)}${field('NPC ID（逗号分隔）','npcIds',d.npcIds)}${field('对话标题','title',d.title,'full')}</div><h2 class="section-title">对话节点</h2><div>${d.branches.map(branchCard).join('')}</div><button class="small" data-add-branch>+ 添加节点</button>`}
function keyName(k){return /^[A-Za-z0-9_ -]+$/.test(k)?k:JSON.stringify(k)} function scalar(v){return typeof v==='boolean'||typeof v==='number'?String(v):JSON.stringify(String(v??''))}
function yaml(obj,indent=0){const pad=' '.repeat(indent),out=[],emit=(key,value,level)=>{const prefix=' '.repeat(level),name=keyName(key);if(typeof value==='string'&&value.includes('\n')){out.push(`${prefix}${name}: |`);value.split(/\r?\n/).forEach(line=>out.push(`${prefix}  ${line}`));}else out.push(`${prefix}${name}: ${scalar(value)}`)};for(const [k,v] of Object.entries(obj)){const key=keyName(k);if(Array.isArray(v)){if(!v.length){out.push(`${pad}${key}: []`);continue}out.push(`${pad}${key}:`);for(const item of v){if(item&&typeof item==='object'&&!Array.isArray(item)){const entries=Object.entries(item);const [firstKey,firstValue]=entries[0];if(typeof firstValue==='string'&&firstValue.includes('\n')){out.push(`${pad}  - ${keyName(firstKey)}: |`);firstValue.split(/\r?\n/).forEach(line=>out.push(`${pad}      ${line}`));}else out.push(`${pad}  - ${keyName(firstKey)}: ${scalar(firstValue)}`);for(const [ik,iv] of entries.slice(1)){if(Array.isArray(iv)){out.push(`${pad}    ${keyName(ik)}:`);iv.forEach(x=>out.push(`${pad}      - ${scalar(x)}`))}else emit(ik,iv,indent+4)}}else out.push(`${pad}  - ${scalar(item)}`)}}else if(v&&typeof v==='object'){out.push(`${pad}${key}:`);out.push(yaml(v,indent+2))}else emit(k,v,indent)}const text=out.join('\n');if(indent!==0)return text;const spaced=[];for(const line of text.split('\n')){if(line&&!line.startsWith(' ')&&spaced.length&&spaced[spaced.length-1]!=='')spaced.push('');spaced.push(line)}return spaced.join('\n')}
function questData(){const q=state.quest,o={"quest-id":blank(q.id)||'new_quest',name:q.name||'',description:lines(q.description),type:q.type};if(q.type!=='describe'){const objectives=q.type==='craft_count'?[q.objectives[0]||defaultObjective('craft_count')]:q.objectives;o.objectives=objectives.map(x=>{const amount=Math.max(1,Number(x.amount)||1),common={...(blank(x.display)?{name:x.display}:{}),...(blank(x.boardLine)?{'board-line':x.boardLine}:{})};if(q.type==='kill_mob')return {mob:blank(x.target),amount,...common};if(q.type==='craft_item')return {crafting:blank(x.target),amount,...common};if(q.type==='craft_count')return {amount,...common};const itemCommon={...common,...(blank(x.itemName)?{'item-name':x.itemName}:{})};if(x.kind==='ni')return {'neige-item':blank(x.target),amount,...itemCommon};return {item:`${blank(x.target)||'STONE'}:${amount}`,...itemCommon}})}if(q.conditionCommands.length)o['condition-commands']=lines(q.conditionCommands);if(q.repeatable)o.repeatable=true;if(Number(q.cooldown)>0)o.cooldown=Number(q.cooldown);if(blank(q.boardTitle))o['board-title']=q.boardTitle;if(q.boardLines.length)o['board-line']=lines(q.boardLines);if(blank(q.navigate))o.navigate=q.navigate;if(q.navigateOnAccept)o['navigate-on-accept']=true;return o}
function dialogueData(){const d=state.dialogue,o={title:d.title||'', 'npc id':parseNpcIds(d.npcIds)},when=[];d.branches.forEach(b=>{const id=b.id||'node';const data=b.data.map(blank).filter(Boolean),papi=b.papi.map(blank).filter(Boolean),conditions=[];if(data.length)conditions.push(`check profile data ${data.join(', ')}`);if(papi.length)conditions.push(papi.join(', '));if(conditions.length)when.push({if:conditions.join(', '),open:id});const x={npc:b.lines.length?b.lines:[''],format:'generic',player:[]};b.options.forEach(opt=>{const y={reply:opt.text||''};const actions=[...opt.kether.map(blank).filter(Boolean)];if(blank(opt.goto))actions.push(`goto ${blank(opt.goto)}`);if(opt.close)actions.push('close');if(actions.length)y.then=actions.join('\n');if(opt.mode==='submit'&&blank(opt.quest)){y['submit-quest']=blank(opt.quest);if(opt.submitItems.length)y['submit-items']=opt.submitItems}x.player.push(y)});o[id]=x});o.when=when;return reorderDialogueData(o)}
function parseNpcIds(value){const ids=String(value??'').split(',').map(x=>Number(x.trim())).filter(Number.isFinite);return ids.length===1?String(ids[0]):ids}
function reorderDialogueData(value){const result={title:value.title||'', 'npc id':value['npc id']};if(value.when)result.when=value.when;Object.keys(value).filter(key=>!['title','npc id','when'].includes(key)).forEach(key=>result[key]=value[key]);return result}
function collect(){const root=$('#editor');root.querySelectorAll('[data-key]').forEach(el=>{const key=el.dataset.key;if(['target','amount','display','itemName','boardLine','branchId','text','quest','goto','kind'].includes(key))return;let v=el.type==='checkbox'?el.checked:el.value;if(['description','conditionCommands','boardLines'].includes(key))v=lines(v);if(key==='cooldown')v=Number(v)||0;state[tab][key]=v});if(tab==='quest'){const fields=k=>[...root.querySelectorAll(`[data-key="${k}"]`)];root.querySelectorAll('[data-objective-key=kind]').forEach(e=>state.quest.objectives[+e.dataset.index].kind=e.value);fields('target').forEach((e,i)=>state.quest.objectives[i].target=e.value);fields('amount').forEach((e,i)=>state.quest.objectives[i].amount=Number(e.value)||1);fields('display').forEach((e,i)=>state.quest.objectives[i].display=e.value);fields('itemName').forEach((e,i)=>state.quest.objectives[i].itemName=e.value);fields('boardLine').forEach((e,i)=>state.quest.objectives[i].boardLine=e.value)}else{root.querySelectorAll('[data-branch-key]').forEach(e=>state.dialogue.branches[+e.dataset.index][e.dataset.branchKey]=e.checked);root.querySelectorAll('[data-key="branchId"]').forEach((e,i)=>state.dialogue.branches[i].id=e.value);root.querySelectorAll('[data-option-key]').forEach(e=>{const o=state.dialogue.branches[+e.dataset.branch].options[+e.dataset.option];o[e.dataset.optionKey]=e.type==='checkbox'?e.checked:e.value});root.querySelectorAll('[data-key="text"]').forEach((e,i)=>state.dialogue.branches.flatMap(x=>x.options)[i].text=e.value);root.querySelectorAll('[data-key="quest"]').forEach((e,i)=>state.dialogue.branches.flatMap(x=>x.options)[i].quest=e.value);root.querySelectorAll('[data-key="goto"]').forEach((e,i)=>state.dialogue.branches.flatMap(x=>x.options)[i].goto=e.value);root.querySelectorAll('[data-array-key]').forEach(e=>{const parts=e.dataset.arrayKey.split('.');if(parts.length===2){const [key,bi]=parts;state.dialogue.branches[+bi][key]=[...root.querySelectorAll(`[data-array-key="${key}.${bi}"]`)].map(x=>x.value)}else{const [key,bi,oi]=parts;state.dialogue.branches[+bi].options[+oi][key]=[...root.querySelectorAll(`[data-array-key="${key}.${bi}.${oi}"]`)].map(x=>key==='submitItems'?parseSubmitItem(x.value):x.value)}})}}
function render(){if(state.quest.type!=='describe'&&!state.quest.objectives.length)state.quest.objectives=[defaultObjective(state.quest.type)];if(state.quest.type==='craft_count'&&state.quest.objectives.length>1)state.quest.objectives=state.quest.objectives.slice(0,1);$('#editor').innerHTML=tab==='quest'?questForm():dialogueForm();updatePreview();$('#status').textContent=''}
function updatePreview(){$('#preview').textContent=yaml(tab==='quest'?questData():dialogueData())+'\n'}
document.addEventListener('input',e=>{if(e.target.matches('select'))return;if(e.target.closest('#editor')){collect();saveDraft();updatePreview()}});document.addEventListener('change',e=>{if(e.target.matches('[data-key="type"]')){const previous=state.quest.type,next=e.target.value;collect();if(previous!==next&&next!=='describe')state.quest.objectives=[defaultObjective(next)];saveDraft();render()}else if(e.target.matches('[data-objective-key="kind"]')){collect();saveDraft();render()}else if(e.target.closest('#editor')){collect();saveDraft();updatePreview()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){collect();saveDraft();tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));render();return}collect();if(b.dataset.addObjective!==undefined)state.quest.objectives.push(defaultObjective(state.quest.type));if(b.dataset.removeObjective!==undefined)state.quest.objectives.splice(+b.dataset.removeObjective,1);if(b.dataset.addBranch!==undefined)state.dialogue.branches.push({id:'node_'+(state.dialogue.branches.length+1),data:[],papi:[],lines:[''],options:[{text:'',mode:'none',quest:'',submitItems:[],kether:[],goto:'',close:false}]});if(b.dataset.removeBranch!==undefined)state.dialogue.branches.splice(+b.dataset.removeBranch,1);if(b.dataset.addOption!==undefined){const bi=+b.dataset.addOption;state.dialogue.branches[bi].options.push({text:'',mode:'none',quest:'',submitItems:[],kether:[],goto:'',close:false})}if(b.dataset.removeOption!==undefined){const [bi,oi]=b.dataset.removeOption.split(',').map(Number);state.dialogue.branches[bi].options.splice(oi,1)}if(b.dataset.addArray!==undefined){const parts=b.dataset.addArray.split('.');if(parts.length===2){const [key,bi]=parts;state.dialogue.branches[+bi][key].push('')}else{const [key,bi,oi]=parts;state.dialogue.branches[+bi].options[+oi][key].push('')}}if(b.dataset.addKetherAccept!==undefined){const [bi,oi]=b.dataset.addKetherAccept.split(',').map(Number);const option=state.dialogue.branches[bi]?.options[oi];if(option){const action=`quest accept ${blank(option.quest)||'<任务ID>'}`;if(!option.kether.some(line=>String(line).trim().toLowerCase()===action.toLowerCase()))option.kether.push(action)}}if(b.dataset.removeArray!==undefined){const k=b.dataset.removeArray,i=+b.dataset.index;if(tab==='quest')state.quest[k].splice(i,1);else{const parts=k.split('.');if(parts.length===2){const [key,bi]=parts;state.dialogue.branches[+bi][key].splice(i,1)}else{const [key,bi,oi]=parts;state.dialogue.branches[+bi].options[+oi][key].splice(i,1)}}}saveDraft();render()});
const safeDownloadName=value=>{const name=String(value??'').trim().replace(/[\\/:*?"<>|]/g,'_').replace(/[\u0000-\u001f\u007f]/g,'_').replace(/[. ]+$/g,'');return name&&name!=='.'&&name!=='..'?name:'customquest'};
$('#copy').onclick=async()=>{collect();saveDraft();await navigator.clipboard.writeText(yaml(tab==='quest'?questData():dialogueData())+'\n');$('#status').textContent='已复制 YAML'};$('#download').onclick=()=>{collect();saveDraft();const text=yaml(tab==='quest'?questData():dialogueData())+'\n',name=safeDownloadName(tab==='quest'?state.quest.file:state.dialogue.file),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/yaml;charset=utf-8'}));a.download=name+'.yml';a.click();URL.revokeObjectURL(a.href);$('#status').textContent='已下载配置文件'};$('#reset').onclick=()=>{clearDraft();state=structuredClone(initial);render();$('#status').textContent='已重置并清除缓存'};render();if(restoredDraft)$('#status').textContent='已恢复上次编辑内容';
</script>
