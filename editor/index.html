<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CustomQuest 配置编辑器</title>
<style>
:root{color-scheme:dark;--bg:#111827;--panel:#1f2937;--panel2:#273449;--line:#3b4a61;--text:#e5e7eb;--muted:#9ca3af;--accent:#60a5fa;--danger:#f87171;--ok:#34d399}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0f172a,#172033);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{padding:24px 32px;border-bottom:1px solid var(--line);background:#111827cc;backdrop-filter:blur(12px);position:sticky;top:0;z-index:2}h1,h2,h3{margin:0 0 8px}h1{font-size:24px}h2{font-size:18px}.subtitle,.hint{color:var(--muted)}main{max-width:1500px;margin:0 auto;padding:24px 32px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab,button{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:9px 13px;cursor:pointer;font-weight:600}.tab.active,button.primary{background:var(--accent);border-color:var(--accent);color:#08111f}.tab:hover,button:hover{filter:brightness(1.12)}button.danger{color:#fecaca;border-color:#854d4d;background:#3b2024}button.small{padding:5px 9px;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(420px,1fr) minmax(420px,1fr);gap:20px}.panel,.card{background:#182235e8;border:1px solid var(--line);border-radius:12px;padding:18px}.panel{min-width:0}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}.field.full{grid-column:1/-1}label{font-weight:700;color:#dbeafe}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:#111827;color:var(--text);padding:8px 10px;font:inherit}textarea{min-height:76px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid #60a5fa66;border-color:var(--accent)}.card{margin:12px 0;background:#202d42}.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.card-head h3{font-size:15px}.array-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin:7px 0}.array-row input{min-width:0}.check{display:flex;flex-direction:row;align-items:center;gap:8px}.check input{width:auto}.preview{position:sticky;top:118px;height:calc(100vh - 145px);display:flex;flex-direction:column}.preview pre{flex:1;overflow:auto;margin:0;background:#0b1120;border:1px solid #24324a;border-radius:8px;padding:16px;color:#d1fae5;white-space:pre-wrap;word-break:break-word}.status{min-height:22px;color:var(--ok);margin-top:8px}.section-title{margin-top:20px;border-bottom:1px solid var(--line);padding-bottom:7px}@media(max-width:1000px){.workspace{grid-template-columns:1fr}.preview{position:static;height:500px}main{padding:18px}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>CustomQuest 配置编辑器</h1><div class="subtitle">离线生成可直接放入 CustomQuest 的 quests/*.yml 与 dialogues/*.yml 配置。</div></header>
<main><div class="tabs"><button class="tab active" data-tab="quest">任务编辑器</button><button class="tab" data-tab="dialogue">NPC 对话编辑器</button></div><div class="workspace"><section class="panel"><div id="editor"></div></section><section class="panel preview"><div class="toolbar"><button class="primary" id="copy">复制 YAML</button><button id="download">下载配置</button><button id="import">导入 YAML</button><input id="file" type="file" accept=".yml,.yaml,text/yaml" hidden><button id="reset">重置</button></div><pre id="preview"></pre><div class="status" id="status"></div></section></div></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), lines=v=>String(v??'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean), blank=v=>String(v??'').trim();
const initial={quest:{file:'my_quest',id:'my_quest',name:'&e新任务',type:'kill_mob',description:['&7任务描述'],objectives:[{target:'Zombie',amount:5,display:'&a僵尸',itemName:'',boardLine:'',kind:'normal'}],conditionCommands:[],repeatable:false,cooldown:0,boardTitle:'',boardLines:[],navigate:''},dialogue:{file:'my_npc',npcIds:'5',title:'&8[&6任务发布官&8] &fNPC',defaultData:[],branches:[{id:'suxing1',defaultBranch:false,data:['5== null'],papi:[],lines:['&f你好，旅行者！'],options:[{text:'&a你有什么任务',hover:'&7点击继续',mode:'none',quest:'',acceptData:[],submitItems:[],kether:['npc data set 5 1'],goto:'suxing2',close:false}]}]}};
let tab='quest', state=structuredClone(initial);
const field=(label,key,value,cls='')=>`<div class="field ${cls}"><label>${label}</label><input data-key="${key}" value="${esc(value)}"></div>`, area=(label,key,value,cls='')=>`<div class="field ${cls}"><label>${label}</label><textarea data-key="${key}">${esc(value)}</textarea></div>`;
const arr=(title,key,values,placeholder='')=>`<div class="field full"><label>${title}</label><div>${values.map((v,i)=>`<div class="array-row"><input data-array-key="${key}" data-index="${i}" value="${esc(v)}" placeholder="${placeholder}"><button class="small danger" data-remove-array="${key}" data-index="${i}">删除</button></div>`).join('')}</div><button class="small" data-add-array="${key}">+ 添加一行</button></div>`;
function objectiveCard(o,i){const ni=state.quest.type==='submit_item'&&o.kind==='ni';return `<div class="card"><div class="card-head"><h3>目标 ${i+1}</h3><button class="small danger" data-remove-objective="${i}">删除</button></div><div class="form-grid">${state.quest.type==='submit_item'?`<div class="field"><label>物品类型</label><select data-objective-key="kind" data-index="${i}"><option value="normal" ${!ni?'selected':''}>普通 Bukkit 材料</option><option value="ni" ${ni?'selected':''}>NeigeItems ID</option></select></div>`:''}${field(ni?'NeigeItems ID':tab==='quest'&&state.quest.type==='kill_mob'?'MythicMobs 内部名':'材料:数量','target',o.target)}${field('数量','amount',o.amount)}${field('显示名称（可选）','display',o.display)}${state.quest.type==='submit_item'?field('物品自定义名限制（可选）','itemName',o.itemName):''}${field('计分板行（可选）','boardLine',o.boardLine,'full')}</div></div>`}
function questForm(){const q=state.quest;return `<h2>任务配置</h2><div class="hint">生成后保存为 plugins/CustomQuest/quests/${esc(q.file||'任务ID')}.yml</div><div class="form-grid">${field('文件名（不含 .yml）','file',q.file)}${field('任务 ID','id',q.id)}${field('任务名称','name',q.name,'full')}<div class="field"><label>任务类型</label><select data-key="type"><option value="kill_mob" ${q.type==='kill_mob'?'selected':''}>击杀 MythicMobs</option><option value="submit_item" ${q.type==='submit_item'?'selected':''}>提交物品</option><option value="describe" ${q.type==='describe'?'selected':''}>描述任务</option></select></div>${area('任务描述（每行一条）','description',q.description.join('\n'),'full')}</div><h2 class="section-title">目标</h2><div>${q.type==='describe'?'<div class="hint">描述任务不需要配置目标。</div>':q.objectives.map(objectiveCard).join('')}</div>${q.type!=='describe'?'<button class="small" data-add-objective>+ 添加目标</button>':''}<h2 class="section-title">高级设置</h2><div class="form-grid">${area('达成条件后执行的控制台命令（每行一条）','conditionCommands',q.conditionCommands.join('\n'),'full')}<div class="field"><label class="check"><input type="checkbox" data-key="repeatable" ${q.repeatable?'checked':''}>允许重复接取</label></div>${field('重复接取冷却（秒）','cooldown',q.cooldown)}${field('计分板标题（可选）','boardTitle',q.boardTitle)}${area('自定义计分板行（每行一条）','boardLines',q.boardLines.join('\n'))}${field('导航位置（world,x,y,z）','navigate',q.navigate,'full')}</div>`}
function optionCard(o,bi,oi){return `<div class="card"><div class="card-head"><h3>选项 ${oi+1}</h3><button class="small danger" data-remove-option="${bi},${oi}">删除</button></div><div class="form-grid">${field('按钮文字','text',o.text)}${field('悬浮提示','hover',o.hover)}<div class="field"><label>快捷动作</label><select data-option-key="mode" data-branch="${bi}" data-option="${oi}"><option value="accept" ${o.mode==='accept'?'selected':''}>接取任务</option><option value="submit" ${o.mode==='submit'?'selected':''}>提交任务</option><option value="none" ${o.mode==='none'?'selected':''}>无</option></select></div>${field('接取/提交任务 ID','quest',o.quest)}${field('点击后跳转节点（可选）','goto',o.goto||'')}${arr('接取成功后设置数据（key=value）',`acceptData.${bi}.${oi}`,o.acceptData,'例如 stage=doing')}${o.mode==='submit'?arr('覆盖提交物品（MATERIAL:数量 或 neige-item:ID:数量）',`submitItems.${bi}.${oi}`,o.submitItems):''}${arr('Kether 动作（每行一条）',`kether.${bi}.${oi}`,o.kether)}<div class="field"><label class="check"><input type="checkbox" data-option-key="close" data-branch="${bi}" data-option="${oi}" ${o.close?'checked':''}>点击后关闭对话</label></div></div></div>`}
function branchCard(b,i){return `<div class="card"><div class="card-head"><h3>对话节点 ${i+1}</h3><button class="small danger" data-remove-branch="${i}">删除</button></div><div class="form-grid">${field('节点 ID','branchId',b.id)}<div class="field"><label class="check"><input type="checkbox" data-branch-key="defaultBranch" data-index="${i}" ${b.defaultBranch?'checked':''}>兜底节点 default: true</label></div>${arr('NPC 变量条件（如 5== null）',`data.${i}`,b.data)}${arr('PAPI 条件（如 %player_level% >= 10）',`papi.${i}`,b.papi)}${arr('NPC 对话内容（每行一条）',`lines.${i}`,b.lines,'对话文本')}${b.options.map((o,j)=>optionCard(o,i,j)).join('')}<button class="small" data-add-option="${i}">+ 添加按钮</button></div></div>`}
function dialogueForm(){const d=state.dialogue;return `<h2>NPC 对话配置</h2><div class="hint">生成后保存为 plugins/CustomQuest/dialogues/${esc(d.file||'对话文件')}.yml；NPC 变量未配置默认值，首次判断为 null。</div><div class="form-grid">${field('文件名（不含 .yml）','file',d.file)}${field('NPC ID（逗号分隔）','npcIds',d.npcIds)}${field('对话标题','title',d.title,'full')}</div><h2 class="section-title">对话节点</h2><div>${d.branches.map(branchCard).join('')}</div><button class="small" data-add-branch>+ 添加节点</button>`}
function keyName(k){return /^[A-Za-z0-9_ -]+$/.test(k)?k:JSON.stringify(k)} function scalar(v){return typeof v==='boolean'||typeof v==='number'?String(v):JSON.stringify(String(v??''))}
function yaml(obj,indent=0){const pad=' '.repeat(indent),out=[];for(const [k,v] of Object.entries(obj)){const key=keyName(k);if(Array.isArray(v)){if(!v.length){out.push(`${pad}${key}: []`);continue}out.push(`${pad}${key}:`);for(const item of v){if(item&&typeof item==='object'&&!Array.isArray(item)){const entries=Object.entries(item);out.push(`${pad}  - ${keyName(entries[0][0])}: ${scalar(entries[0][1])}`);for(const [ik,iv] of entries.slice(1)){if(Array.isArray(iv)){out.push(`${pad}    ${keyName(ik)}:`);iv.forEach(x=>out.push(`${pad}      - ${scalar(x)}`))}else out.push(`${pad}    ${keyName(ik)}: ${scalar(iv)}`)}}else out.push(`${pad}  - ${scalar(item)}`)}}else if(v&&typeof v==='object'){out.push(`${pad}${key}:`);out.push(yaml(v,indent+2))}else out.push(`${pad}${key}: ${scalar(v)}`)}return out.join('\n')}
function questData(){const q=state.quest,o={"quest-id":blank(q.id)||'new_quest',name:q.name||'',description:lines(q.description),type:q.type};if(q.type!=='describe')o.objectives=q.objectives.map(x=>{const amount=Math.max(1,Number(x.amount)||1),common={...(blank(x.display)?{name:x.display}:{}),...(blank(x.itemName)?{'item-name':x.itemName}:{}),...(blank(x.boardLine)?{'board-line':x.boardLine}:{})};if(q.type==='kill_mob')return {mob:blank(x.target),amount,...common};if(x.kind==='ni')return {'neige-item':blank(x.target),amount,...common};return {item:`${blank(x.target)||'STONE'}:${amount}`,...common}});if(q.conditionCommands.length)o['condition-commands']=lines(q.conditionCommands);if(q.repeatable)o.repeatable=true;if(Number(q.cooldown)>0)o.cooldown=Number(q.cooldown);if(!blank(q.boardTitle))o['board-title']=q.boardTitle;if(q.boardLines.length)o['board-line']=lines(q.boardLines);if(blank(q.navigate))o.navigate=q.navigate;return o}
function dialogueData(){const d=state.dialogue,o={title:d.title||'', 'npc id':parseNpcIds(d.npcIds)},when=[];d.branches.forEach(b=>{const id=b.id||'node';const data=b.data.map(blank).filter(Boolean),papi=b.papi.map(blank).filter(Boolean),conditions=[];if(data.length)conditions.push(`check profile data ${data.join(', ')}`);if(papi.length)conditions.push(papi.join(', '));if(conditions.length)when.push({if:conditions.join(', '),open:id});const x={npc:b.lines.length?b.lines:[''],format:'generic',player:[]};if(b.defaultBranch)x.default=true;b.options.forEach(opt=>{const y={reply:opt.text||''};if(blank(opt.hover))y.hover=opt.hover;const actions=[...opt.kether.map(blank).filter(Boolean)];if(blank(opt.goto))actions.push(`goto ${blank(opt.goto)}`);if(opt.close)actions.push('close');if(actions.length)y.then=actions.join('\n');if(opt.mode==='accept'&&!blank(opt.quest)){y['accept-quest']=blank(opt.quest);if(opt.acceptData.length)y['accept-data']=opt.acceptData.length===1?opt.acceptData[0]:opt.acceptData}else if(opt.mode==='submit'&&!blank(opt.quest)){y['submit-quest']=blank(opt.quest);if(opt.submitItems.length)y['submit-items']=opt.submitItems}x.player.push(y)});o[id]=x});if(when.length)o.when=when;return reorderDialogueData(o)}
function parseNpcIds(value){const ids=String(value??'').split(',').map(x=>Number(x.trim())).filter(Number.isFinite);return ids.length===1?String(ids[0]):ids}
function reorderDialogueData(value){const result={title:value.title||'', 'npc id':value['npc id']};if(value.when)result.when=value.when;Object.keys(value).filter(key=>!['title','npc id','when'].includes(key)).forEach(key=>result[key]=value[key]);return result}
function collect(){const root=$('#editor');root.querySelectorAll('[data-key]').forEach(el=>{const key=el.dataset.key;if(['target','amount','display','itemName','boardLine','branchId','text','hover','quest','goto','kind'].includes(key))return;let v=el.type==='checkbox'?el.checked:el.value;if(['description','conditionCommands','boardLines'].includes(key))v=lines(v);if(key==='cooldown')v=Number(v)||0;state[tab][key]=v});if(tab==='quest'){const fields=k=>[...root.querySelectorAll(`[data-key="${k}"]`)];root.querySelectorAll('[data-objective-key=kind]').forEach(e=>state.quest.objectives[+e.dataset.index].kind=e.value);fields('target').forEach((e,i)=>state.quest.objectives[i].target=e.value);fields('amount').forEach((e,i)=>state.quest.objectives[i].amount=Number(e.value)||1);fields('display').forEach((e,i)=>state.quest.objectives[i].display=e.value);fields('itemName').forEach((e,i)=>state.quest.objectives[i].itemName=e.value);fields('boardLine').forEach((e,i)=>state.quest.objectives[i].boardLine=e.value)}else{root.querySelectorAll('[data-branch-key]').forEach(e=>state.dialogue.branches[+e.dataset.index][e.dataset.branchKey]=e.checked);root.querySelectorAll('[data-key="branchId"]').forEach((e,i)=>state.dialogue.branches[i].id=e.value);root.querySelectorAll('[data-option-key]').forEach(e=>{const o=state.dialogue.branches[+e.dataset.branch].options[+e.dataset.option];o[e.dataset.optionKey]=e.type==='checkbox'?e.checked:e.value});root.querySelectorAll('[data-key="text"]').forEach((e,i)=>state.dialogue.branches.flatMap(x=>x.options)[i].text=e.value);root.querySelectorAll('[data-key="hover"]').forEach((e,i)=>state.dialogue.branches.flatMap(x=>x.options)[i].hover=e.value);root.querySelectorAll('[data-key="quest"]').forEach((e,i)=>state.dialogue.branches.flatMap(x=>x.options)[i].quest=e.value);root.querySelectorAll('[data-key="goto"]').forEach((e,i)=>state.dialogue.branches.flatMap(x=>x.options)[i].goto=e.value);root.querySelectorAll('[data-array-key]').forEach(e=>{const parts=e.dataset.arrayKey.split('.');if(parts[0]==='defaultData')state.dialogue.defaultData=[...root.querySelectorAll('[data-array-key="defaultData"]')].map(x=>x.value);else if(parts.length===2){const [key,bi]=parts;state.dialogue.branches[+bi][key]=[...root.querySelectorAll(`[data-array-key="${key}.${bi}"]`)].map(x=>x.value)}else{const [key,bi,oi]=parts;state.dialogue.branches[+bi].options[+oi][key]=[...root.querySelectorAll(`[data-array-key="${key}.${bi}.${oi}"]`)].map(x=>x.value)}})}}
function render(){state.quest.objectives=state.quest.objectives.length?state.quest.objectives:([{target:state.quest.type==='kill_mob'?'Zombie':'DIAMOND',amount:1,display:'',itemName:'',boardLine:'',kind:'normal'}]);$('#editor').innerHTML=tab==='quest'?questForm():dialogueForm();$('#preview').textContent=yaml(tab==='quest'?questData():dialogueData())+'\n';$('#status').textContent=''}
document.addEventListener('input',e=>{if(e.target.closest('#editor')){collect();$('#preview').textContent=yaml(tab==='quest'?questData():dialogueData())+'\n'}});document.addEventListener('change',e=>{if(e.target.matches('[data-key="type"]')){collect();state.quest.type=e.target.value;render()}else if(e.target.closest('#editor')){collect();render()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){collect();tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));render();return}collect();if(b.dataset.addObjective!==undefined)state.quest.objectives.push({target:state.quest.type==='kill_mob'?'Zombie':'DIAMOND',amount:1,display:'',itemName:'',boardLine:'',kind:'normal'});if(b.dataset.removeObjective!==undefined)state.quest.objectives.splice(+b.dataset.removeObjective,1);if(b.dataset.addBranch!==undefined)state.dialogue.branches.push({id:'node_'+(state.dialogue.branches.length+1),defaultBranch:false,data:[],papi:[],lines:[''],options:[{id:'option_1',text:'',hover:'',mode:'none',quest:'',acceptData:[],submitItems:[],kether:[],goto:'',close:false}]});if(b.dataset.removeBranch!==undefined)state.dialogue.branches.splice(+b.dataset.removeBranch,1);if(b.dataset.addOption!==undefined){const bi=+b.dataset.addOption;state.dialogue.branches[bi].options.push({id:'option_'+(state.dialogue.branches[bi].options.length+1),text:'',hover:'',mode:'none',quest:'',acceptData:[],submitItems:[],kether:[],goto:'',close:false})}if(b.dataset.removeOption!==undefined){const [bi,oi]=b.dataset.removeOption.split(',').map(Number);state.dialogue.branches[bi].options.splice(oi,1)}if(b.dataset.addArray!==undefined){const k=b.dataset.addArray;if(k==='defaultData')state.dialogue.defaultData.push('');else{const parts=k.split('.');if(parts.length===2){const [key,bi]=parts;state.dialogue.branches[+bi][key].push('')}else{const [key,bi,oi]=parts;state.dialogue.branches[+bi].options[+oi][key].push('')}}}if(b.dataset.removeArray!==undefined){const k=b.dataset.removeArray,i=+b.dataset.index;if(k==='defaultData')state.dialogue.defaultData.splice(i,1);else if(tab==='quest')state.quest[k].splice(i,1);else{const parts=k.split('.');if(parts.length===2){const [key,bi]=parts;state.dialogue.branches[+bi][key].splice(i,1)}else{const [key,bi,oi]=parts;state.dialogue.branches[+bi].options[+oi][key].splice(i,1)}}}render()});
$('#copy').onclick=async()=>{collect();await navigator.clipboard.writeText(yaml(tab==='quest'?questData():dialogueData())+'\n');$('#status').textContent='已复制 YAML'};$('#download').onclick=()=>{collect();const text=yaml(tab==='quest'?questData():dialogueData())+'\n',name=(tab==='quest'?state.quest.file:state.dialogue.file).replace(/[^\w.-]+/g,'_')||'customquest',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/yaml;charset=utf-8'}));a.download=name+'.yml';a.click();URL.revokeObjectURL(a.href);$('#status').textContent='已下载配置文件'};$('#reset').onclick=()=>{state=structuredClone(initial);render();$('#status').textContent='已重置'};render();
</script>
<script src="import.js"></script>
</body>
</html>
